name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate required environment variables
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" ]; then
            echo "❌ ERROR: NEXT_PUBLIC_BACKEND_URL secret is not set."
            echo "Add it at: Repository Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✓ NEXT_PUBLIC_BACKEND_URL is set"

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL }}
        run: npm run build
